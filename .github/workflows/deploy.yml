name: Deploy to GitHub Pages

# Gated on CI actually passing, not just running after it by coincidence:
# this only fires once the CI workflow_run completes, and the job-level `if`
# below still checks its conclusion before doing anything.
#
# Publishes to the gh-pages branch (Pages source = branch, not the Actions
# artifact) so PR previews (pr-preview.yml) can coexist as subfolders on the
# same branch/site instead of each deploy wiping the other's content.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @amigurumi/pipeline run build:catalog

      - run: pnpm run typecheck

      - run: pnpm --filter @amigurumi/web run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/web/dist
          publish_branch: gh-pages
          # Merge into the branch rather than replacing it wholesale -- an
          # active PR preview's pr-preview/<n>/ subfolder must survive a
          # production deploy landing at the same time.
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy production build for ${{ github.sha }}"
